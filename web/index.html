<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FTM Snake</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="join-view" class="view">
      <form id="join-form" class="card">
        <h1>FTM Snake</h1>
        <input id="name-input" maxlength="16" placeholder="Your name" autocomplete="off" required autofocus />
        <label for="lobby-ip-input">Lobby IP</label>
        <input id="lobby-ip-input" type="text" placeholder="192.168.1.10:8080" aria-describedby="lobby-ip-help" autocomplete="off" autocapitalize="none" spellcheck="false" required />
        <small id="lobby-ip-help">Host IP or hostname, optional port (default 8080), or ws:// / wss:// URL.</small>
        <button type="submit">Play</button>
      </form>
    </main>

    <main id="game-view" class="view" hidden>
      <div class="game">
        <header class="bar">
          <span class="stat"><span class="apple-icon"></span><span id="score">0</span></span>
          <span id="player-name"></span>
          <button id="leave-button" class="icon-button" title="Leave">✕</button>
        </header>
        <p id="match-status" class="match-status" role="status"></p>
        <div class="board-wrap">
          <canvas id="board"></canvas>
          <div id="overlay" class="overlay">
            <div class="panel">
              <p id="overlay-text"></p>
              <div id="lobby" class="lobby" hidden>
                <p id="lobby-summary" class="lobby-summary"></p>
                <ul id="lobby-list" tabindex="0" aria-label="Players in the lobby"></ul>
                <button id="ready-button">Ready</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
